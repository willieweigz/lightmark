<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --scale: 1; --ink:#242424; --muted:#6b6b6b; --line:#e3e3df; --paper:#fbfbf8; --code:#f1f1ed; --accent:#5769b5; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8e8e5; --muted:#aaa; --line:#41413d; --paper:#1d1d1b; --code:#292927; --accent:#aab6ff; } }
  * { box-sizing:border-box; }
  html { background:var(--paper); }
  body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC",sans-serif; font-size:calc(16px * var(--scale)); line-height:1.78; -webkit-font-smoothing:antialiased; }
  #page { max-width:820px; margin:0 auto; padding:56px 56px 120px; }
  h1,h2,h3,h4,h5,h6 { line-height:1.3; margin:1.7em 0 .65em; letter-spacing:-.015em; }
  h1 { font-size:2.15em; margin-top:.2em; padding-bottom:.35em; border-bottom:1px solid var(--line); }
  h2 { font-size:1.6em; padding-bottom:.25em; border-bottom:1px solid var(--line); }
  h3 { font-size:1.28em; }
  h4 { font-size:1.08em; }
  p { margin:.85em 0; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  strong { font-weight:650; }
  mark { color:#211d12; background:#fff0a8; border-radius:.2em; padding:.04em .14em; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .text-red { color:#c73532; }
  @media (prefers-color-scheme: dark) { .text-red { color:#ff7974; } }
  blockquote { margin:1.25em 0; padding:.25em 1.1em; border-left:4px solid #aaa; color:var(--muted); }
  code { font-family:"SFMono-Regular",Menlo,Consolas,monospace; font-size:.86em; background:var(--code); border-radius:5px; padding:.16em .38em; }
  pre { overflow:auto; background:var(--code); border:1px solid var(--line); border-radius:10px; padding:17px 19px; line-height:1.55; }
  pre code { padding:0; background:none; }
  table { width:100%; border-collapse:collapse; margin:1.3em 0; font-size:.94em; }
  th,td { border:1px solid var(--line); padding:8px 12px; text-align:left; }
  th { background:var(--code); font-weight:650; }
  img { display:block; max-width:100%; height:auto; margin:1.5em auto; border-radius:7px; }
  hr { border:0; border-top:1px solid var(--line); margin:2.5em 0; }
  ul,ol { padding-left:1.6em; }
  li { margin:.28em 0; }
  input[type=checkbox] { margin-right:.5em; }
  .callout { --callout:#5b7cfa; margin:1.3em 0; border:1px solid color-mix(in srgb,var(--callout) 35%,transparent); border-left:4px solid var(--callout); border-radius:9px; padding:11px 15px 12px; background:color-mix(in srgb,var(--callout) 9%,var(--paper)); }
  .callout-title { color:var(--callout); display:flex; align-items:center; gap:8px; font-weight:700; line-height:1.4; }
  .callout-icon { width:20px; text-align:center; }
  details.callout > summary { cursor:pointer; list-style:none; user-select:none; }
  details.callout > summary::-webkit-details-marker { display:none; }
  .callout-fold { margin-left:auto; font-size:1.2em; line-height:1; transition:transform .16s ease; }
  details.callout[open] .callout-fold { transform:rotate(90deg); }
  .callout-body > :first-child { margin-top:.55em; }
  .callout-body > :last-child { margin-bottom:0; }
  .callout-note,.callout-info,.callout-todo { --callout:#4c79d8; }
  .callout-abstract,.callout-summary,.callout-tldr { --callout:#2d9fa3; }
  .callout-tip,.callout-hint,.callout-important { --callout:#24a6a8; }
  .callout-success,.callout-check,.callout-done { --callout:#2d9d78; }
  .callout-question,.callout-help,.callout-faq { --callout:#c19a16; }
  .callout-warning,.callout-caution,.callout-attention { --callout:#d18a18; }
  .callout-danger,.callout-error,.callout-failure,.callout-fail,.callout-missing,.callout-bug { --callout:#d94c4c; }
  .callout-example { --callout:#8a63cf; }
  .callout-quote,.callout-cite { --callout:#7b7b82; }
  .wikilink { color:var(--accent); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; }
  .frontmatter { margin:0 0 1.8em; border:1px solid var(--line); border-radius:8px; color:var(--muted); }
  .frontmatter summary { cursor:pointer; padding:7px 12px; font-size:.85em; }
  .frontmatter pre { margin:0; border:0; border-top:1px solid var(--line); border-radius:0 0 8px 8px; }
  @media (max-width:680px) { #page { padding:34px 25px 80px; } }
</style>
<!-- Windows/Tauri loads these packaged files directly. The inline placeholders
     remain as the macOS fallback because WKWebView uses the document directory
     as its base URL for relative images. -->
<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script>/*__MARKED__*/</script>
<script>/*__PURIFY__*/</script>
</head>
<body><main id="page"></main>
<script>
  marked.setOptions({ gfm:true, breaks:false });
  const meta = {
    note:['●','Note'], abstract:['≡','Abstract'], summary:['≡','Summary'], tldr:['≡','TL;DR'],
    info:['ℹ','Info'], todo:['☑','Todo'], tip:['◆','Tip'], hint:['◆','Hint'], important:['◆','Important'],
    success:['✓','Success'], check:['✓','Check'], done:['✓','Done'], question:['?','Question'], help:['?','Help'], faq:['?','FAQ'],
    warning:['!','Warning'], caution:['!','Caution'], attention:['!','Attention'], failure:['×','Failure'], fail:['×','Fail'], missing:['×','Missing'],
    danger:['!','Danger'], error:['!','Error'], bug:['●','Bug'], example:['◇','Example'], quote:['❝','Quote'], cite:['❝','Cite']
  };
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function inlineWiki(md) {
    return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_,target,label) => `<span class="wikilink" title="${esc(target)}">${esc(label || target)}</span>`);
  }
  function frontmatter(md) {
    if (!md.startsWith('---\n')) return {head:'', body:md};
    const end = md.indexOf('\n---\n',4);
    if (end < 0) return {head:'', body:md};
    const raw = md.slice(4,end);
    return {head:`<details class="frontmatter"><summary>文档属性</summary><pre><code>${esc(raw)}</code></pre></details>`,body:md.slice(end+5)};
  }
  function renderBlocks(md) {
    const lines = md.replace(/\r\n?/g,'\n').split('\n');
    let out='', regular=[];
    const flush = () => { if (regular.length) { out += marked.parse(inlineWiki(regular.join('\n'))); regular=[]; } };
    for (let i=0;i<lines.length;i++) {
      const match = lines[i].match(/^>\s*\[!([\w-]+)\]([+-])?\s*(.*)$/i);
      if (!match) { regular.push(lines[i]); continue; }
      flush();
      const type=match[1].toLowerCase(), fold=match[2], body=[];
      while (i+1<lines.length) {
        const q=lines[i+1].match(/^> ?(.*)$/);
        if (!q) break;
        body.push(q[1]); i++;
      }
      const fallback=type.charAt(0).toUpperCase()+type.slice(1), icon=(meta[type]||['●',fallback])[0];
      const title=match[3] || (meta[type]||['',fallback])[1];
      const bodyHTML=renderBlocks(body.join('\n'));
      const titleHTML=`<span class="callout-icon">${icon}</span><span>${esc(title)}</span>`;
      if (fold) {
        const open=fold==='+'?' open':'';
        out += `<details class="callout callout-${esc(type)}" data-callout="${esc(type)}"${open}><summary class="callout-title">${titleHTML}<span class="callout-fold">›</span></summary><div class="callout-body">${bodyHTML}</div></details>`;
      } else {
        out += `<aside class="callout callout-${esc(type)}" data-callout="${esc(type)}"><div class="callout-title">${titleHTML}</div><div class="callout-body">${bodyHTML}</div></aside>`;
      }
    }
    flush(); return out;
  }
  window.lightmarkRender = md => {
    const fm=frontmatter(md);
    const html=fm.head+renderBlocks(fm.body);
    document.getElementById('page').innerHTML=DOMPurify.sanitize(html,{ADD_TAGS:['aside','details','summary'],ADD_ATTR:['class','open','title','data-callout']});
  };
  window.lightmarkSetScale = scale => document.documentElement.style.setProperty('--scale',scale);
</script>
</body></html>
