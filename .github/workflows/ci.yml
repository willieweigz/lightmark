name: Cross-platform CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  windows:
    name: Windows frontend and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build

  macos:
    name: macOS universal app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build universal app
        env:
          LIGHTMARK_ARCHS: arm64,x86_64
        run: zsh build.sh
      - name: Verify app
        run: |
          lipo -info "dist/轻阅 Markdown.app/Contents/MacOS/LightMark"
          codesign --verify --deep --strict "dist/轻阅 Markdown.app"
