name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.5.1
        required: true
        default: v0.5.1

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Show Rust toolchain
        run: rustc --version
      - name: Install dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - name: Build Tauri installer
        run: npm run tauri build
      - name: Prepare Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          Copy-Item -LiteralPath $installer.FullName -Destination "release/LightMark_Windows_x64_Setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: lightmark-windows
          path: release/LightMark_Windows_x64_Setup.exe
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build universal app
        env:
          LIGHTMARK_ARCHS: arm64,x86_64
        run: zsh build.sh
      - name: Verify architectures and package app
        run: |
          lipo -info "dist/轻阅 Markdown.app/Contents/MacOS/LightMark"
          codesign --verify --deep --strict "dist/轻阅 Markdown.app"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/轻阅 Markdown.app" "release/LightMark_macOS_Universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: lightmark-macos
          path: release/LightMark_macOS_Universal.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lightmark-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/LightMark_Windows_x64_Setup.exe \
            release/LightMark_macOS_Universal.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "轻阅 Markdown ${RELEASE_TAG#v}" \
            --generate-notes \
            --notes "Windows 与 macOS 安装包均未使用商业开发者证书签名。首次打开时请按 README 中的说明确认运行。"
